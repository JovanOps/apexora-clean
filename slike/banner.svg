<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <title>Apexora Clean </title>
  <desc>Finalni wordmark logo – Apexora Clean </desc>

  <!-- Pozadina (transparentna za produkciju) -->
  <!-- <rect width="800" height="200" fill="#F7F9FB"/> -->

  <!-- Wordmark -->
  <text
    x="400"
    y="108"
    font-family="Georgia, 'Times New Roman', Times, serif"
    font-size="72"
    font-weight="400"
    fill="#1A2E28"
    letter-spacing="4"
    text-anchor="middle"
    dominant-baseline="auto">Apexora <tspan fill="#1D9E75">Clean</tspan></text>

  <!-- GmbH -->
  <text
    x="400"
    y="142"
    font-family="Georgia, 'Times New Roman', Times, serif"
    font-size="18"
    font-weight="400"
    fill="#888780"
    letter-spacing="12"
    text-anchor="middle"></text>

  <!-- Separator linija -->
  <line x1="220" y1="152" x2="580" y2="152" stroke="#C0DDD4" stroke-width="0.8"/>

  <!-- Tagline -->
  <text
    x="400"
    y="174"
    font-family="Georgia, 'Times New Roman', Times, serif"
    font-size="14"
    font-weight="400"
    fill="#9FE1CB"
    letter-spacing="3"
    text-anchor="middle">Reinheit. Vertrauen. Qualität.</text>
</svg>
